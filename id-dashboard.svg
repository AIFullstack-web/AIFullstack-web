<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="title desc">
<title id="title">Developer ID and engineering dashboard</title><desc id="desc">A swinging holographic developer badge with an original vector portrait sits beside a current-focus dashboard.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121728"/><stop offset="1" stop-color="#0d0e16"/></linearGradient>
 <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee" stop-opacity=".05"/><stop offset=".45" stop-color="#a78bfa" stop-opacity=".65"/><stop offset=".6" stop-color="#f472b6" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".05"/></linearGradient>
 <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter>
 <style><![CDATA[
 text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,Consolas,monospace}
 .swing{transform-box:fill-box;transform-origin:50% 0%;animation:swing 6s ease-in-out infinite}
 @keyframes swing{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
 @keyframes foil{0%{transform:translateX(-230px);opacity:0}20%{opacity:.9}80%{opacity:.3}100%{transform:translateX(230px);opacity:0}}
 .foilsweep{animation:foil 5s ease-in-out infinite}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 ]]></style>
</defs>
<rect width="1280" height="600" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1278" height="598" rx="25" fill="none" stroke="url(#a)" stroke-opacity=".6"/>
<text x="52" y="52" fill="#22d3ee" font-size="12" font-weight="700" letter-spacing="3">DEVELOPER ID / CURRENT OPERATING MODE</text>
