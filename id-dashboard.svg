  <text x="54" y="31" fill="#eceef6" font-size="15" font-weight="700">AI-assisted applications</text><text x="54" y="49" fill="#94a2bb" font-size="11">LLM workflows · anomaly detection concepts</text>
  <rect x="534" y="30" width="150" height="8" rx="4" fill="#26334a"/><rect x="534" y="30" width="95" height="8" rx="4" fill="#a78bfa"/>
