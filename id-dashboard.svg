 </g>
 <text x="0" y="472" fill="#7d8eaa" font-size="10" letter-spacing="1.5">NOW</text>
 <text x="0" y="496" fill="#eceef6" font-size="14">Shipping portfolio projects · practicing DSA in Java · strengthening backend concepts</text>
 <text x="0" y="530" class="mono" fill="#65738e" font-size="10">STATUS VALUES ARE QUALITATIVE FOCUS INDICATORS, NOT LIVE PERFORMANCE METRICS.</text>
</g>
