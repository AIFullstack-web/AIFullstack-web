 <text x="642" y="220" font-size="18" font-weight="900" text-anchor="middle" fill="#d7ffd0">JS</text>
 <text x="642" y="248" font-size="16" font-weight="800" text-anchor="middle" fill="#eceef6">Node.js</text>
 <text x="642" y="265" font-size="10" text-anchor="middle" fill="#93a4bf">BACKEND CORE</text>
</g>
<g>
