<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" width="1280" height="570" role="img" aria-labelledby="title desc">
<title id="title">Chandan's technology orbit</title><desc id="desc">Node.js sits at the center of orbiting technologies, with Express.js and MongoDB as close satellites. Skill groups appear below.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111727"/><stop offset="1" stop-color="#0d0e16"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style><![CDATA[
 text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,Consolas,monospace}
 .orbitline{fill:none;stroke:#6d7b9a;stroke-opacity:.38;stroke-width:1.2;stroke-dasharray:4 8}
 .chip{fill:#111a29;stroke:#33445c;stroke-width:1}.chiptext{fill:#cbd5e1;font-size:13px}
 @keyframes breathe{0%,100%{filter:drop-shadow(0 0 3px #22d3ee)}50%{filter:drop-shadow(0 0 13px #22d3ee)}}
 .core{animation:breathe 3.5s ease-in-out infinite}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 ]]></style>
</defs>
<rect width="1280" height="570" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="1278" height="568" rx="25" fill="none" stroke="url(#neon)" stroke-opacity=".6"/>
<text x="54" y="52" fill="#22d3ee" font-size="12" font-weight="700" letter-spacing="3">THE TECH ORBIT</text>
<text x="54" y="83" fill="#eceef6" font-size="26" font-weight="800">A practical stack, always in motion.</text>
<text x="1225" y="54" class="mono" fill="#7a89a5" font-size="11" text-anchor="end">CORE → CONNECT → SHIP</text>
